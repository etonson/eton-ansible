---
- name: Set up Professional Development Environment (Dotfiles & Neovim)
  hosts: localhost
  vars_files:
    - ../vars/default.yml
    - [ "../vars/secrets.yml", "../vars/secrets.yml.example" ]
    - [ "../vars/vault.yml", "../vars/vault.yml.example" ]

  roles:
    - system
    - ssh
    - git
    - zsh
    - local_scripts
    - wezterm
    - desktop
    - neovim
